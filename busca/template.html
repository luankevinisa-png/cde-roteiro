<style>
/* Layout: app de tela cheia. Aba Roteiro = mapa inteiro + faixa da curva em cima + painel embaixo (Waze);
   preto e branco, botões grandes (Uber). Abas Lojas e Salvos rolam por dentro. Azul só no "você está aqui". */
:root {
  --bg: #ffffff; --surface: #ffffff; --raised: #f3f3f3; --fg: #000000; --muted: #5e5e5e; --line: #e6e6e6;
  --btn: #000000; --btn-fg: #ffffff; --banner: #000000; --banner-fg: #ffffff; --banner-sub: #bdbdbd;
  --me: #1e6bff; --done: #9a9a9a; --ok: #0a7a3d; --closed: #b3261e;
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --tabs-h: calc(62px + env(safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #121212; --raised: #1f1f1f; --fg: #ffffff; --muted: #a8a8a8; --line: #2a2a2a;
  --btn: #ffffff; --btn-fg: #000000; --banner: #ffffff; --banner-fg: #000000; --banner-sub: #555555;
  --me: #4d8dff; --done: #6b6b6b; --ok: #4cc27f; --closed: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #121212; --raised: #1f1f1f; --fg: #ffffff; --muted: #a8a8a8; --line: #2a2a2a;
  --btn: #ffffff; --btn-fg: #000000; --banner: #ffffff; --banner-fg: #000000; --banner-sub: #555555;
  --me: #4d8dff; --done: #6b6b6b; --ok: #4cc27f; --closed: #ff8a80; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 16px/1.45 var(--font); overflow: hidden }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--me); outline-offset: 2px }
.app { position: fixed; inset: 0; display: flex; flex-direction: column }
.view { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain }
.pad { padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)) }

/* abas */
.tabs { display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
.tabs button { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 56px }
.tabs button[aria-selected="true"] { color: var(--fg) }
.tabs svg { width: 24px; height: 24px }

/* botões */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: 12px;
  border: 0; font-weight: 700; font-size: 16px; text-decoration: none; text-align: center; padding: 0 14px }
.btn.big { min-height: 58px; font-size: 18px }
.btn.dark { background: var(--btn); color: var(--btn-fg) }
.btn.grey { background: var(--raised); color: var(--fg) }
.btn:active { transform: scale(0.98) }
.btn:disabled { opacity: 0.55; cursor: not-allowed }
.row { display: flex; gap: 8px }
.row > * { flex: 1; min-width: 0 }
.link { background: none; border: 0; padding: 8px 2px; font-weight: 700; font-size: 14px; color: var(--fg); text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: var(--line); min-height: 40px }
.link.danger { color: var(--closed) }
input.field, select.field { width: 100%; min-width: 0; background: var(--raised); border: 1.5px solid transparent; border-radius: 12px;
  padding: 12px 14px; min-height: 48px; font-size: 16px }
input.field:focus, select.field:focus { outline: none; border-color: var(--fg) }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin: 0; line-height: 1.1 }
h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0; line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance }
.meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums }
.open { color: var(--ok) } .shut { color: var(--closed) }

/* roteiro: mapa + faixa + painel */
#map { position: absolute; inset: 0; z-index: 0; background: var(--raised) }
.leaflet-control-attribution { font-size: 10px }
#map .leaflet-tile-pane { filter: grayscale(1) contrast(0.92) brightness(1.04) }
#map.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) grayscale(1) brightness(0.85) contrast(0.9) }
.over { position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)) }
.over > * { pointer-events: auto }
.over.top { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; justify-items: end }
.banner { width: 100%; background: var(--banner); color: var(--banner-fg); border-radius: 18px; padding: 12px 14px;
  display: flex; gap: 12px; align-items: center; min-height: 66px }
.banner svg { width: 34px; height: 34px; flex: none; transition: transform 0.2s }
.banner b { display: block; font-size: 24px; line-height: 1.05; font-variant-numeric: tabular-nums }
.banner span { display: block; font-size: 14px; color: var(--banner-sub); overflow-wrap: anywhere }
.chip { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--surface); border-radius: 22px 22px 0 0;
  box-shadow: 0 -6px 24px rgb(0 0 0 / 0.12); display: grid; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)) }
.grab { width: 38px; height: 4px; border-radius: 9px; background: var(--line); margin: 0 auto 2px }
.stack { display: grid; gap: 12px }
.stack[hidden] { display: none }
.small-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px }
.msg { font-size: 14px; color: var(--fg); background: var(--raised); border-radius: 12px; padding: 10px 12px }

/* lojas */
.search-wrap { position: sticky; top: 0; z-index: 3; background: var(--bg); display: grid; gap: 10px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)) }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px }
.chips::-webkit-scrollbar { display: none }
.chips button { flex: none; border: 0; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 700;
  background: var(--raised); color: var(--fg); white-space: nowrap; min-height: 40px }
.chips button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg) }
.list { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)) }
.item { display: flex; gap: 12px; align-items: center; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 12px 0; text-align: left; min-height: 64px }
.ico { width: 42px; height: 42px; border-radius: 12px; background: var(--raised); display: grid; place-items: center; flex: none }
.ico svg { width: 22px; height: 22px }
.item .t { flex: 1; min-width: 0 }
.item .t b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .t small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .d { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabs-h) + 16px); z-index: 3; border: 0;
  border-radius: 999px; background: var(--btn); color: var(--btn-fg); padding: 14px 18px; font-weight: 800; font-size: 15px;
  display: flex; gap: 6px; align-items: center; box-shadow: 0 6px 18px rgb(0 0 0 / 0.22) }
.fab svg { width: 20px; height: 20px }
.empty { text-align: center; color: var(--muted); padding: 40px 12px }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }

/* folhas (galeria, detalhe, adicionar) */
dialog { border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 90vh; margin: auto auto 0; border-radius: 22px 22px 0 0;
  background: var(--surface); color: var(--fg) }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 22px } }
dialog::backdrop { background: rgb(0 0 0 / 0.5) }
.dlg { display: grid; gap: 14px; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)) }
.dlg-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px }
.x { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--raised); font-size: 18px; font-weight: 800 }
.kicker { font-size: 13px; font-weight: 800; color: var(--me) }
.floor-h { font-size: 13px; font-weight: 800; color: var(--muted); margin: 8px 0 0 }
.shop { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.shop > div { flex: 1; min-width: 0 }
.shop b { display: block; overflow-wrap: anywhere }
.shop small { color: var(--muted) }
.shop.done b { text-decoration: line-through; color: var(--done) }
.shop .btn { width: auto; min-height: 40px; font-size: 14px; padding: 0 14px; flex: none }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 15px }
dl[hidden] { display: none }
dt { color: var(--muted); font-size: 13px; padding-top: 2px }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; user-select: text }
dd a { color: var(--fg); font-weight: 700 }
.lbl { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted) }

/* salvos */
.trip { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line) }
.trip input { font-weight: 800; font-size: 19px; background: transparent; border: 0; border-bottom: 1.5px dashed var(--line);
  padding: 4px 0; width: 100%; min-width: 0 }
.trip input:focus { outline: none; border-bottom-color: var(--fg) }
.card { background: var(--raised); border-radius: 16px; padding: 14px; display: grid; gap: 10px }

.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 50;
  max-width: calc(100% - 32px); background: var(--btn); color: var(--btn-fg); padding: 10px 16px; border-radius: 999px;
  font-weight: 700; font-size: 14px; text-align: center }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none } .banner svg { transition: none } }
</style>

<div class="app">

    <div class="over top">
      <div class="banner" id="banner" hidden>
        <svg id="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V5M5 11l7-7 7 7"/></svg>
        <div><b id="turn-dist"></b><span id="turn-text"></span></div>
      </div>
      <span class="chip" id="progress"></span>
    </div>
    <div class="sheet" id="sheet">

<script>
const LOJAS = __DADOS__;
const GERADO = "__GERADO__";
const $ = id => document.getElementById(id);

const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nichos = l => l.Nicho ? l.Nicho.split(",").map(s => s.trim()).filter(Boolean) : [];
const fullAddress = l => [l.Nome, l.Galeria, l.Andar, l.Box && "Box " + l.Box, l.Endereço, "Ciudad del Este, Paraguai"].filter(Boolean).join(", ");

function haversine(a, b) { // metros
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace(".", ",")} km`;
const minutos = m => Math.max(1, Math.round(m / 75)); // ~4,5 km/h a pé
console.assert(Math.abs(haversine({ lat: -25.5106, lng: -54.6093 }, { lat: -25.5106, lng: -54.6193 }) - 1004) < 5, "haversine");

// horário do site: "Segunda a Sexta 07:00-16:00; Sábado 07:00-15:00" (Brasília = Paraguai, UTC-3)
const DIAS = { domingo: 0, segunda: 1, terca: 2, quarta: 3, quinta: 4, sexta: 5, sabado: 6 };
function abertaAgora(h, now = new Date()) {
  if (!h) return null;
  const d = now.getDay(), min = now.getHours() * 60 + now.getMinutes();
  for (const parte of h.split(";")) {
    const m = norm(parte).match(/^\s*([a-z]+)(?:\s+a\s+([a-z]+))?\s+(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
    if (!m || !(m[1] in DIAS)) continue;
    const a = DIAS[m[1]], b = m[2] in DIAS ? DIAS[m[2]] : a;
    if (a <= b ? d >= a && d <= b : d >= a || d <= b) return min >= +m[3] * 60 + +m[4] && min < +m[5] * 60 + +m[6];
  }
  return false; // tem horário, mas não abre hoje
}
console.assert(abertaAgora("Segunda a Sexta 07:00-16:00", new Date(2026, 10, 20, 10)) === true
  && abertaAgora("Segunda a Sexta 07:00-16:00", new Date(2026, 10, 20, 17)) === false
  && abertaAgora("Segunda a Sexta 07:00-16:00", new Date(2026, 10, 22, 10)) === false, "abertaAgora");
const statusTxt = h => { const a = abertaAgora(h); return a === null ? "" : a ? `<span class="open">aberta</span>` : `<span class="shut">fechada agora</span>` };

// ---------- dados: base do site + lojas que você adicionou ----------
function prep(l) {
  l.id = l.criada ? "extra|" + l.criada : [l.Nome, l.Galeria, l.Andar, l.Endereço, l.Latitude].join("|");
  l._q = norm([l.Nome, l.Galeria, l.Endereço, l.Nicho].join(" "));
  const lat = parseFloat(l.Latitude), lng = parseFloat(l.Longitude);
  if (isFinite(lat) && isFinite(lng)) { l.lat = lat; l.lng = lng }
  return l;
}
const BASE = LOJAS.map(prep);
let BY_ID, GALERIAS, GAL_POS;
function reindex() {
  LOJAS.splice(0, LOJAS.length, ...BASE, ...(state.extras || []).map(e => prep({ ...e })));
  LOJAS.sort((a, b) => a.Nome.localeCompare(b.Nome, "pt"));
  BY_ID = new Map(LOJAS.map(l => [l.id, l]));

function save() {

// ---------- visitar, pular, desfazer ----------
function mark(ids, kind, label) { // kind: "v" visitada, "p" pulada
  ids = ids.filter(id => !visited.has(id) && !skipped.has(id));
  if (!ids.length) return;
  ids.forEach(id => (kind === "v" ? visited : skipped).add(id));
  state.historico.push({ ids, kind });
  if (state.destino && ids.includes(state.destino)) state.destino = null;
  const p = posOf(BY_ID.get(ids[0]));
  if (p && !state.gps) state.origem = { ...p, label: `última loja: ${label}` };
  save(); render(); toast(kind === "v" ? `${label}: visitada` : `${label}: pulada`);
}
$("undo").addEventListener("click", () => {

  if (!last) return toast("Nada para desfazer");
  const { ids, kind } = Array.isArray(last) ? { ids: last, kind: "v" } : last;
  ids.forEach(id => (kind === "v" ? visited : skipped).delete(id));
  save(); render(); toast("Desfeito");
});

// ---------- próxima parada: galeria = uma parada; "Ir até aqui" fura a fila ----------
function nextStop() {
  if (!state.origem) return null;
  const stops = new Map();
  LOJAS.forEach(l => {
    if (!pendente(l) || !(inFilter(l) || l.id === state.destino)) return;
    const key = l.Galeria || l.id, pos = posOf(l);
    if (!pos) return;
    (stops.get(key) || stops.set(key, { key, pos, galeria: l.Galeria, lojas: [] }).get(key)).lojas.push(l);
  });
  let best = null;
  stops.forEach(s => {
    s.dist = haversine(state.origem, s.pos);
    s.forced = !!state.destino && s.lojas.some(l => l.id === state.destino);
    if (!best || (s.forced && !best.forced) || (s.forced === best.forced && s.dist < best.dist)) best = s;
  });
  return best;
}

let currentStop = null;
function renderRoute() {
  const s = currentStop = nextStop();
  const pool = LOJAS.filter(inFilter), done = pool.filter(l => visited.has(l.id)).length;
  const atual = roteiroAtual();
  $("progress").textContent = `${done} de ${pool.length}` + (atual ? ` · ${atual.nome}` : "");
  $("s-where").hidden = !!state.origem;

      s.galeria ? `${s.lojas.length} ${s.lojas.length > 1 ? "lojas" : "loja"}` : esc(nichos(l)[0] || ""), s.galeria ? "" : statusTxt(l.Horário)].filter(Boolean).join(" · ");
    $("arrive").textContent = s.galeria ? "Cheguei na galeria" : "Cheguei";
  }

}
$("arrive").addEventListener("click", () => {

  else mark([s.lojas[0].id], "v", s.lojas[0].Nome);
});
$("skip").addEventListener("click", () => {

// ---------- mapa e rota a pé (OpenStreetMap) ----------
function distToLine(p, cs) { // metros do ponto até a linha da rota
  const kx = 111320 * Math.cos(p.lat * Math.PI / 180), ky = 110540;
  let best = Infinity;
  for (let i = 1; i < cs.length; i++) {
    const ax = (cs[i - 1].lng - p.lng) * kx, ay = (cs[i - 1].lat - p.lat) * ky, bx = (cs[i].lng - p.lng) * kx, by = (cs[i].lat - p.lat) * ky;
    const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / ((dx * dx + dy * dy) || 1)));
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}
console.assert(Math.abs(distToLine({ lat: -25.5101, lng: -54.61 }, [{ lat: -25.51, lng: -54.611 }, { lat: -25.51, lng: -54.609 }]) - 11) < 1, "distToLine");

const TURN = { left: ["vire à esquerda", -90], right: ["vire à direita", 90], "slight left": ["vire levemente à esquerda", -45],
  "slight right": ["vire levemente à direita", 45], "sharp left": ["vire bem à esquerda", -135], "sharp right": ["vire bem à direita", 135],
  uturn: ["faça o retorno", 180], straight: ["siga em frente", 0] };
function instr(st) {
  const m = st.maneuver, rua = st.name ? ` na ${st.name}` : "";
  if (m.type === "arrive") return ["você chega à parada", 0];
  if (m.type === "roundabout" || m.type === "rotary") return [`na rotatória, pegue a ${m.exit || ""}ª saída${rua}`, 45];
  const [txt, deg] = TURN[m.modifier] || TURN.straight;
  return [txt + rua, deg];
}

let map, youDot, youAcc, stopDot, routeLine, route = null, routeKey = null, routeAt = 0, arrivedKey = null;
const canMap = () => typeof L !== "undefined" && !window.claude; // dentro do claude.ai o mapa é bloqueado
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light";

function ensureMap() {
  if (map || !canMap()) return;
  map = L.map("map", { zoomControl: false }).setView([-25.5097, -54.6111], 16);
  // mapa do OpenStreetMap (grátis, sem chave); o CSS deixa em tons de cinza para combinar com o app
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  if (dark()) $("map").classList.add("dark");
  routeLine = L.polyline([], { color: cssVar("--fg"), weight: 7, opacity: 0.9, lineCap: "round" }).addTo(map);
  youAcc = L.circle([0, 0], { radius: 0, color: cssVar("--me"), weight: 1, fillOpacity: 0.12 }).addTo(map);
  youDot = L.circleMarker([0, 0], { radius: 9, color: "#ffffff", weight: 4, fillColor: cssVar("--me"), fillOpacity: 1 }).addTo(map);
  stopDot = L.marker([0, 0], { icon: L.divIcon({ className: "", iconSize: [22, 22],
    html: `<div style="width:22px;height:22px;border-radius:5px;background:${cssVar("--fg")};border:3px solid ${cssVar("--bg")}"></div>` }) }).addTo(map);
}

function updateNav(s) {
  ensureMap();
  if (!map || !state.origem) { $("banner").hidden = true; return }
  const me = [state.origem.lat, state.origem.lng];
  youDot.setLatLng(me); youAcc.setLatLng(me).setRadius(state.origem.acc || 0);
  if (!s) { $("banner").hidden = true; routeLine.setLatLngs([]); stopDot.setOpacity(0); map.setView(me, 17); routeKey = null; return }
  stopDot.setOpacity(1).setLatLng([s.pos.lat, s.pos.lng]);
  $("banner").hidden = false;
  if (state.gps && s.dist < 30 && arrivedKey !== s.key) { // "cheguei": raio de 30 m, o GPS erra entre prédios
    arrivedKey = s.key; navigator.vibrate?.([200, 100, 200]);
    toast(`Você chegou: ${s.galeria || s.lojas[0].Nome}`);
  }
  const off = route && distToLine(state.origem, route.coords) > 25;
  if (routeKey !== s.key || (off && Date.now() - routeAt > 15000)) fetchRoute(s);
  else renderStep();
}

async function fetchRoute(s) {
  routeKey = s.key; routeAt = Date.now(); route = null;
  const o = state.origem;
  setBanner("…", "calculando a rota a pé", 0);
  try {
    const r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${o.lng},${o.lat};${s.pos.lng},${s.pos.lat}?overview=full&geometries=geojson&steps=true`).then(r => r.json());
    if (r.code !== "Ok") throw new Error(r.code);
    if (routeKey !== s.key) return; // a parada mudou enquanto buscava
    const rt = r.routes[0], coords = rt.geometry.coordinates.map(([lng, lat]) => ({ lat, lng }));
    const cum = [0];
    for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + haversine(coords[i - 1], coords[i]));
    const near = p => coords.reduce((bi, c, i) => haversine(p, c) < haversine(p, coords[bi]) ? i : bi, 0);
    const steps = rt.legs[0].steps.map(st => ({ st, at: near({ lat: st.maneuver.location[1], lng: st.maneuver.location[0] }) }));
    route = { coords, cum, steps, near };
    routeLine.setStyle({ dashArray: null }).setLatLngs(coords.map(c => [c.lat, c.lng]));
  } catch {
    if (routeKey !== s.key) return;
    route = null; // sem rota: linha reta tracejada até a loja
    routeLine.setStyle({ dashArray: "2 12" }).setLatLngs([[o.lat, o.lng], [s.pos.lat, s.pos.lng]]);
  }
  const sheetH = $("sheet").offsetHeight, topH = $("banner").offsetHeight + 20;
  map.fitBounds(L.latLngBounds([...routeLine.getLatLngs(), [o.lat, o.lng], [s.pos.lat, s.pos.lng]]),
    { paddingTopLeft: [30, topH + 30], paddingBottomRight: [30, sheetH + 20], maxZoom: 18 });
  renderStep();
}
function setBanner(dist, text, deg) {
  $("turn-dist").textContent = dist; $("turn-text").textContent = text; $("arrow").style.transform = `rotate(${deg}deg)`;
}
function renderStep() {
  if (!currentStop) return;
  if (!route) return setBanner(fmtDist(currentStop.dist), "em linha reta (sem rota agora)", 0);
  const me = state.origem, k = route.near(me);
  const next = route.steps.find((x, i) => i > 0 && x.at > k) || route.steps[route.steps.length - 1];
  const [txt, deg] = instr(next.st);
  setBanner(fmtDist(haversine(me, { lat: next.st.maneuver.location[1], lng: next.st.maneuver.location[0] })), txt, deg);
}

function copyText(text, okMsg) {

  const fallback = () => state.origem ? use(state.origem.lat, state.origem.lng, state.origem.label)
    : ($("add-pos").textContent = "Sem localização. Libere o GPS na aba Roteiro e tente de novo.");
  if (!navigator.geolocation) return fallback();
  navigator.geolocation.getCurrentPosition(p => use(p.coords.latitude, p.coords.longitude, `GPS agora (±${Math.round(p.coords.accuracy)} m)`),
    fallback, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
});
$("add-form").addEventListener("submit", e => {
  e.preventDefault();
  const nome = $("add-nome").value.trim();
  if (!nome || !addPos) return;
  state.extras = [...(state.extras || []), { Nome: nome, Nicho: $("add-nicho").value.trim(), Galeria: $("add-gal").value.trim(),
    Andar: $("add-andar").value.trim(), Box: "", Endereço: "", Latitude: addPos.lat.toFixed(6), Longitude: addPos.lng.toFixed(6),
    Horário: "", Telefone: "", WhatsApp: "", Observação: `Adicionada por você em ${new Date().toLocaleDateString("pt-BR")}`, criada: Date.now() }];
  reindex(); save(); render(); $("add-dlg").close(); toast(`${nome} adicionada`);
});
const COLS = ["Nome", "Nicho", "Galeria", "Andar", "Box", "Endereço", "Latitude", "Longitude", "Horário", "Telefone", "WhatsApp", "Observação"];
$("export").addEventListener("click", () => copyText( // linhas no formato de dados/lojas_extras.csv
  [COLS, ...state.extras.map(e => COLS.map(c => String(e[c] ?? "").replace(/[;\n]/g, " ")))].map(r => r.join(";")).join("\n"),
  "Copiado. Cole em dados/lojas_extras.csv no computador"));

// ---------- roteiros salvos ----------
const fmtData = t => new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
const roteiroAtual = () => state.roteiros.find(r => r.id === state.atualId);
function guardarAtual() { // salva (ou atualiza) o roteiro em andamento; false se não há nada marcado
  if (!visited.size && !skipped.size) return false;
  const r = roteiroAtual();
  const dados = { visitadas: [...visited], puladas: [...skipped], nichos: [...NSEL], data: Date.now() };
  if (r) Object.assign(r, dados);
  else state.roteiros.unshift({ id: Date.now(), nome: `Roteiro de ${fmtData(Date.now())}`, ...dados });
  return true;
}
function limparAtual() { visited.clear(); skipped.clear(); state.historico = []; state.atualId = null; state.destino = null }
$("finish").addEventListener("click", () => {
  if (!guardarAtual()) return toast("Marque pelo menos uma loja antes de salvar");
  const nome = (roteiroAtual() || state.roteiros[0]).nome;
  limparAtual(); save(); render(); toast(`“${nome}” salvo em Roteiros`);
});
function renderSaved() {
  const atual = roteiroAtual();
  $("current").innerHTML = `<div class="meta">Em andamento${atual ? ` · ${esc(atual.nome)}` : ""}</div>
    <h2>${visited.size} ${visited.size === 1 ? "loja visitada" : "lojas visitadas"}</h2>
    <button class="btn dark" type="button" data-finish>Finalizar e salvar</button>`;
  const rs = state.roteiros.filter(r => r.id !== state.atualId);
  $("saved-list").innerHTML = rs.length ? rs.map(r => `<div class="trip">
      <input type="text" value="${esc(r.nome)}" data-rename="${r.id}" aria-label="Nome do roteiro" maxlength="60">
      <div class="meta">${fmtData(r.data)} · ${r.visitadas.length} ${r.visitadas.length === 1 ? "loja visitada" : "lojas visitadas"}${r.nichos?.length ? " · " + esc(r.nichos.join(", ")) : ""}</div>
      <div class="row"><button class="btn dark" type="button" data-resume="${r.id}">Continuar</button>
        <button class="btn grey" type="button" data-del="${r.id}">Apagar</button></div></div>`).join("")
    : `<p class="empty">Nenhum roteiro salvo ainda. Quando terminar o dia, toque em “Finalizar e salvar”.</p>`;
}
$("current").addEventListener("click", e => { if (e.target.closest("[data-finish]")) $("finish").click() });
$("saved-list").addEventListener("change", e => {
  const i = e.target.closest("[data-rename]"); if (!i) return;
  const r = state.roteiros.find(x => x.id === +i.dataset.rename), nome = i.value.trim();
  if (!r) return;
  if (!nome) { i.value = r.nome; return toast("O nome não pode ficar vazio") }
  r.nome = nome; save(); render(); toast("Nome salvo");
});
$("saved-list").addEventListener("click", e => {
  const go = e.target.closest("[data-resume]");
  if (go) {
    const r = state.roteiros.find(x => x.id === +go.dataset.resume);
    if (guardarAtual()) toast("O roteiro em andamento foi salvo antes de trocar");
    limparAtual();
    r.visitadas.forEach(id => visited.add(id)); (r.puladas || []).forEach(id => skipped.add(id)); state.atualId = r.id;
    setNichos(r.nichos || []);
    save(); render(); switchTab("v-rota"); return toast(`Continuando “${r.nome}”`);
  }
  const del = e.target.closest("[data-del]");
  if (del) { // dois toques para apagar
    if (!del.dataset.armed) { del.dataset.armed = 1; del.textContent = "Toque de novo"; return }
    state.roteiros = state.roteiros.filter(x => x.id !== +del.dataset.del);
    save(); render(); toast("Roteiro apagado");
  }
});

// ---------- lista de lojas ----------
const ICON_STORE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10M19 21V10M4 7l2-4h12l2 4M4 7h16v1a3 3 0 0 1-6 0 3 3 0 0 1-4 0 3 3 0 0 1-6 0z"/></svg>';
const ICON_GAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M2 21h20M9 7h1M14 7h1M9 11h1M14 11h1M10 21v-4h4v4"/></svg>';
function render() {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  let shown = LOJAS.filter(l => !visited.has(l.id) && inFilter(l) && words.every(w => l._q.includes(w)));
  if (state.origem) { // com posição: mais perto primeiro; sem coordenada vai para o fim
    const d = l => posOf(l) ? haversine(state.origem, posOf(l)) : Infinity;
    shown = shown.map(l => [d(l), l]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  }
  // shortcut: desenha só os 150 primeiros (celular trava com centenas de linhas); a busca acha o resto
  $("list").innerHTML = shown.length ? shown.slice(0, 150).map(l => {
    const dist = state.origem && posOf(l) ? fmtDist(haversine(state.origem, posOf(l))) : "";
    const sub = [nichos(l)[0], l.Galeria ? [l.Galeria, l.Andar].filter(Boolean).join(", ") : "loja de rua",
      abertaAgora(l.Horário) === false ? "fechada agora" : "", skipped.has(l.id) ? "pulada" : ""].filter(Boolean).join(" · ");
    return `<button class="item" type="button" data-shop="${esc(l.id)}"><span class="ico">${l.Galeria ? ICON_GAL : ICON_STORE}</span>
      <span class="t"><b>${esc(l.Nome)}</b><small>${esc(sub)}</small></span><span class="d">${dist}</span></button>`;
  }).join("") : `<p class="empty">Nenhuma loja encontrada. Tente parte do nome, sem acento.</p>`;
  $("count").textContent = `${shown.length} ${shown.length === 1 ? "loja" : "lojas"}` + (shown.length > 150 ? " · mostrando as 150 mais perto" : "")
    + (visited.size ? ` · ${visited.size} ${visited.size === 1 ? "visitada escondida" : "visitadas escondidas"}` : "");
  renderRoute(); renderGal(); renderSaved();
  try { localStorage.setItem("filtros", JSON.stringify({ q: $("q").value, n: [...NSEL], g: $("galeria").value })) } catch {}
}
$("list").addEventListener("click", e => { const b = e.target.closest("[data-shop]"); if (b) openLoja(b.dataset.shop) });
["q", "galeria"].forEach(id => $(id).addEventListener("input", render));

// ---------- abas ----------
function switchTab(id) {
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== id);
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  if (id === "v-rota" && map) setTimeout(() => map.invalidateSize(), 0);
}
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2400) }

try {
  const f = JSON.parse(localStorage.getItem("filtros") || "{}");
  $("q").value = f.q || ""; $("galeria").value = f.g || ""; setNichos([].concat(f.n || []));
} catch {}
render();
if (state.gps) askGps(true); // já tinha liberado o GPS antes: volta a seguir sozinho
</script>
