<style>
/* Layout: uma coluna para celular. Roteiro (próxima parada) no topo, busca fixa, cards empilhados; 2 colunas em telas largas */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --fg: #13201b; --muted: #56675f;
  --line: #d9e2de; --accent: #0b7356; --accent-fg: #ffffff; --accent-soft: #e2f1eb;
  --wa: #0d7a3f; --warn: #8a5a00; --warn-soft: #fbf0d9;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1412; --surface: #151f1c; --fg: #e6eeeb; --muted: #97aaa2;
  --line: #26332f; --accent: #46c99d; --accent-fg: #06221a; --accent-soft: #173029;
  --wa: #4cd486; --warn: #f0c36a; --warn-soft: #2c2412; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #151f1c; --fg: #e6eeeb; --muted: #97aaa2;
  --line: #26332f; --accent: #46c99d; --accent-fg: #06221a; --accent-soft: #173029;
  --wa: #4cd486; --warn: #f0c36a; --warn-soft: #2c2412; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 960px; margin: 0 auto }

header { padding-block: 20px 4px }
h1 { font: 700 clamp(26px, 6vw, 34px)/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 14px }

/* Roteiro */
.route { margin-top: 14px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 18px; padding: 16px;
  display: grid; gap: 12px }
.stop-name { font: 700 22px/1.15 var(--font-display); margin: 2px 0 0; overflow-wrap: anywhere }
.stop-meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums }
.stop-meta b { color: var(--fg) }
.row { display: flex; flex-wrap: wrap; gap: 8px }
.row > * { flex: 1 1 140px }
.nav { display: grid; gap: 8px }
.step { font-size: 16px; line-height: 1.35; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-variant-numeric: tabular-nums }
.step small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px }
#map { height: 320px; border-radius: 14px; border: 1px solid var(--line); z-index: 0; background: var(--bg) }
.origin { display: grid; gap: 8px; font-size: 14px; color: var(--muted) }
.origin input { width: 100%; font: 500 15px var(--font-body); color: var(--fg); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px }
.msg { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 10px }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted) }
.link { background: none; border: 0; padding: 6px 2px; font: 600 14px var(--font-body); color: var(--accent); cursor: pointer; min-height: 40px }
.link.danger { color: var(--warn) }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); margin-top: 8px }
.search { width: 100%; font: 500 17px var(--font-body); color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; min-height: 52px }
.search:focus, .origin input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
select { width: 100%; min-width: 0; font: 500 14px var(--font-body); color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px }
select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }

.list { display: grid; gap: 12px; margin-top: 14px; grid-template-columns: 1fr }
@media (min-width: 720px) { .list { grid-template-columns: 1fr 1fr } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.name { font: 600 19px/1.2 var(--font-display); margin: 0; overflow-wrap: anywhere }
.nicho { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
  border-radius: 999px; padding: 3px 10px; white-space: nowrap; max-width: 50%; overflow: hidden; text-overflow: ellipsis }
.where { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline }
.where .floor, .dist { color: var(--muted); font-weight: 500 }
.dist { font-variant-numeric: tabular-nums; margin-left: auto }
.gal { background: none; border: 0; padding: 0; font: inherit; color: var(--fg); text-decoration: underline;
  text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; text-align: left }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px }
dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 2px }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; user-select: text }
dd a { color: var(--accent); font-weight: 600; text-decoration: none }
dd a.wa { color: var(--wa) }
.note { font-size: 13px; color: var(--muted) }
.actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 2px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px;
  border-radius: 12px; font: 600 15px var(--font-body); text-decoration: none; cursor: pointer; padding: 0 10px; text-align: center }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line) }
.btn.main { background: var(--accent); color: var(--accent-fg); border: 1.5px solid var(--accent) }
.btn.soft { background: var(--accent-soft); color: var(--accent); border: 1.5px solid transparent }
.btn:active { transform: scale(0.98) }
.btn svg { width: 18px; height: 18px; flex: none }
.empty { text-align: center; color: var(--muted); padding: 40px 0 }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-weight: 600; font-size: 14px; z-index: 20; text-align: center }

/* Galeria: folha com as lojas por andar */
dialog { border: 0; padding: 0; width: min(560px, 100%); max-height: 88vh; margin: auto auto 0; border-radius: 20px 20px 0 0;
  background: var(--surface); color: var(--fg) }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 20px } }
dialog::backdrop { background: rgb(0 0 0 / 0.45) }
.sheet { display: grid; gap: 14px; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) }
.sheet h2 { font: 700 22px/1.15 var(--font-display); margin: 0; overflow-wrap: anywhere }
.floor-h { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0 }
.shop { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.shop > div { flex: 1; min-width: 0 }
.shop b { display: block; overflow-wrap: anywhere }
.shop small { color: var(--muted) }
.shop.done b { text-decoration: line-through; color: var(--muted) }
.shop .btn { min-height: 44px; flex: none; padding: 0 14px }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none } }
</style>

<div class="wrap">
  <header>
    <h1>Lojas de Ciudad del Este</h1>
    <p class="sub" id="sub"></p>
  </header>

  <section class="route" aria-label="Próxima parada">
    <div>
      <h2 class="stop-name" id="stop-name">Defina onde você está</h2>
      <div class="stop-meta" id="stop-meta">Toque em “Perto de mim”, cole sua localização ou marque a primeira loja como “Já fui”.</div>
    </div>
    <div class="row" id="stop-actions" hidden>
      <a class="btn main" id="stop-go" target="_blank" rel="noopener">Ir a pé</a>
      <button class="btn soft" type="button" id="stop-open">Ver lojas</button>
      <button class="btn ghost" type="button" id="stop-done">Já fui</button>
    </div>
    <div class="nav" id="nav" hidden>
      <div class="step" id="step" aria-live="polite"></div>
      <div id="map" role="region" aria-label="Mapa com a rota a pé até a próxima parada"></div>
    </div>
    <div class="origin">
      <div class="row">
        <button class="btn ghost" type="button" id="gps">Perto de mim</button>
        <input id="paste" type="text" inputmode="decimal" placeholder="Colar localização (-25.51, -54.61)" aria-label="Colar localização do Google Maps">
      </div>
      <div class="msg" id="msg" hidden></div>
      <div id="origin-label"></div>
    </div>
    <div class="tools">
      <span id="progress"></span>
      <button class="link" type="button" id="undo">Desfazer última</button>
      <button class="link danger" type="button" id="reset">Reiniciar roteiro</button>
    </div>
  </section>

  <div class="bar">
    <input id="q" class="search" type="search" placeholder="Nome da loja, galeria ou rua" aria-label="Buscar loja" autocomplete="off">
    <div class="filters">
      <select id="nicho" aria-label="Filtrar por nicho"><option value="">Todos os nichos</option></select>
      <select id="galeria" aria-label="Filtrar por galeria"><option value="">Todas as galerias</option><option value="-">Só lojas de rua</option></select>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <main class="list" id="list"></main>
</div>

<dialog id="sheet" aria-labelledby="sheet-h">
  <div class="sheet">
    <div class="top">
      <div><h2 id="sheet-h"></h2><div class="stop-meta" id="sheet-meta"></div></div>
      <button class="btn ghost" type="button" id="sheet-close" aria-label="Fechar">✕</button>
    </div>
    <div class="row">
      <a class="btn main" id="sheet-go" target="_blank" rel="noopener">Ir a pé</a>
      <button class="btn ghost" type="button" id="sheet-all">Terminei a galeria</button>
    </div>
    <div id="sheet-list"></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

function haversine(a, b) { // metros
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

    const snap = await doc.get();

      state = { visitadas: d.visitadas || [], historico: d.historico || [], origem: d.origem || null };

function onPos(p) {

function askGps(quiet) {

}

function nextStop() {
  if (!state.origem) return null;
  const stops = new Map();
  LOJAS.forEach(l => {
    if (visited.has(l.id) || !inFilter(l)) return;
    const key = l.Galeria || l.id, pos = posOf(l);
    if (!pos) return;
    (stops.get(key) || stops.set(key, { key, pos, galeria: l.Galeria, lojas: [] }).get(key)).lojas.push(l);
  });
  let best = null;
  stops.forEach(s => { s.dist = haversine(state.origem, s.pos); if (!best || s.dist < best.dist) best = s });
  return best;
}

function distToLine(p, cs) { // metros do ponto até a linha da rota
  const kx = 111320 * Math.cos(p.lat * Math.PI / 180), ky = 110540;
  let best = Infinity;
  for (let i = 1; i < cs.length; i++) {
    const ax = (cs[i - 1].lng - p.lng) * kx, ay = (cs[i - 1].lat - p.lat) * ky, bx = (cs[i].lng - p.lng) * kx, by = (cs[i].lat - p.lat) * ky;
    const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / ((dx * dx + dy * dy) || 1)));
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}

function instr(st) {
  const m = st.maneuver, rua = st.name ? ` na ${st.name}` : "";
  if (m.type === "arrive") return "você chega à parada";
  if (m.type === "roundabout" || m.type === "rotary") return `na rotatória, pegue a ${m.exit || ""}ª saída${rua}`;
  if (!m.modifier || m.modifier === "straight") return `siga em frente${rua}`;
  return `vire ${DIR[m.modifier]}${rua}`;
}

  const show = !!(s && state.origem && canMap());
  const wasHidden = $("nav").hidden;
  $("nav").hidden = !show;
  if (!show) return;
  if (!map) {
    map = L.map("map", { zoomControl: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    routeLine = L.polyline([], { color: cssVar("--accent"), weight: 6, opacity: 0.9 }).addTo(map);
    youAcc = L.circle([0, 0], { radius: 0, color: "#2a7de1", weight: 1, fillOpacity: 0.12 }).addTo(map);
    youDot = L.circleMarker([0, 0], { radius: 8, color: "#ffffff", weight: 3, fillColor: "#2a7de1", fillOpacity: 1 }).addTo(map);
    stopDot = L.circleMarker([0, 0], { radius: 11, color: "#ffffff", weight: 3, fillColor: "#d1495b", fillOpacity: 1 }).addTo(map);
  } else if (wasHidden) map.invalidateSize();
  youDot.setLatLng([state.origem.lat, state.origem.lng]);
  youAcc.setLatLng([state.origem.lat, state.origem.lng]).setRadius(state.origem.acc || 0);
  stopDot.setLatLng([s.pos.lat, s.pos.lng]).bindTooltip(s.galeria || s.lojas[0].Nome);
  if (state.gps && s.dist < 30 && arrivedKey !== s.key) { // "cheguei": raio de 30 m, GPS erra entre prédios
    arrivedKey = s.key; navigator.vibrate?.([200, 100, 200]);
    toast(`Você chegou: ${s.galeria || s.lojas[0].Nome}`);
  }
  const off = route && distToLine(state.origem, route.coords) > 25;
  if (routeKey !== s.key || (off && Date.now() - routeAt > 15000)) fetchRoute(s);
  else renderStep();
}

async function fetchRoute(s) {
  routeKey = s.key; routeAt = Date.now(); route = null;
  const o = state.origem;
  $("step").innerHTML = "Calculando a rota a pé…";
  try {
    const r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${o.lng},${o.lat};${s.pos.lng},${s.pos.lat}?overview=full&geometries=geojson&steps=true`).then(r => r.json());
    if (r.code !== "Ok") throw new Error(r.code);
    if (routeKey !== s.key) return; // a parada mudou enquanto buscava
    const rt = r.routes[0], coords = rt.geometry.coordinates.map(([lng, lat]) => ({ lat, lng }));
    const cum = [0];
    for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + haversine(coords[i - 1], coords[i]));
    const near = p => coords.reduce((bi, c, i) => haversine(p, c) < haversine(p, coords[bi]) ? i : bi, 0);
    const steps = rt.legs[0].steps.map(st => ({ st, at: near({ lat: st.maneuver.location[1], lng: st.maneuver.location[0] }) }));
    route = { coords, cum, steps, near };
    routeLine.setStyle({ dashArray: null }).setLatLngs(coords.map(c => [c.lat, c.lng]));
  } catch {
    if (routeKey !== s.key) return;
    route = null; // sem rota: linha reta tracejada, o botão "Ir a pé" continua valendo
    routeLine.setStyle({ dashArray: "6 10" }).setLatLngs([[o.lat, o.lng], [s.pos.lat, s.pos.lng]]);
  }
  map.fitBounds(L.latLngBounds([routeLine.getLatLngs(), [o.lat, o.lng], [s.pos.lat, s.pos.lng]].flat()), { padding: [30, 30], maxZoom: 18 });
  renderStep();
}

function renderStep() {
  if (!route) { $("step").innerHTML = `Sem rota a pé agora. Siga a linha tracejada ou toque em “Ir a pé”.<small>${fmtDist(currentStop.dist)} em linha reta</small>`; return }
  const me = state.origem, k = route.near(me);
  const next = route.steps.find((x, i) => i > 0 && x.at > k) || route.steps[route.steps.length - 1];
  const left = route.cum[route.cum.length - 1] - route.cum[k] + haversine(me, route.coords[k]);
  const toTurn = haversine(me, { lat: next.st.maneuver.location[1], lng: next.st.maneuver.location[0] });
  $("step").innerHTML = `<b>Em ${fmtDist(toTurn)}</b>, ${esc(instr(next.st))}<small>Faltam ${fmtDist(left)} a pé · cerca de ${Math.max(1, Math.round(left / 75))} min</small>`;
}

$("stop-open").addEventListener("click", () => currentStop && openGaleria(currentStop.galeria));
$("stop-done").addEventListener("click", () => currentStop && markVisited(currentStop.lojas.map(l => l.id), currentStop.galeria || currentStop.lojas[0].Nome));

// ---------- galeria: lojas por andar ----------
const floorRank = a => a === "Térreo" ? 0 : a === "Subsolo" ? -1 : /^\d+/.test(a) ? parseInt(a) : a ? 50 : 99;
let openGal = null;
function openGaleria(g) { openGal = g; renderSheet(); if (!$("sheet").open) $("sheet").showModal() }
function renderSheet() {
  if (!openGal) return;
  const ls = GALERIAS.get(openGal).filter(inFilter);
  const pend = ls.filter(l => !visited.has(l.id)).length;
  $("sheet-h").textContent = openGal;
  $("sheet-meta").textContent = `${pend} de ${ls.length} ${ls.length > 1 ? "lojas" : "loja"} pendentes` + ($("nicho").value ? ` · ${$("nicho").value}` : "")
    + (state.origem && GAL_POS.get(openGal) ? ` · ${fmtDist(haversine(state.origem, GAL_POS.get(openGal)))}` : "");
  const pos = GAL_POS.get(openGal);
  $("sheet-go").hidden = !pos; if (pos) $("sheet-go").href = walkUrl(pos);
  const floors = new Map();
  [...ls].sort((a, b) => floorRank(a.Andar) - floorRank(b.Andar) || a.Nome.localeCompare(b.Nome, "pt"))
    .forEach(l => (floors.get(l.Andar) || floors.set(l.Andar, []).get(l.Andar)).push(l));
  $("sheet-list").innerHTML = [...floors].map(([andar, items]) => `<h3 class="floor-h">${esc(andar || "Andar não informado")}</h3>` +
    items.map(l => `<div class="shop${visited.has(l.id) ? " done" : ""}"><div><b>${esc(l.Nome)}</b><small>${esc([nichos(l)[0], l.Box && "Box " + l.Box].filter(Boolean).join(" · "))}</small></div>` +
      (visited.has(l.id) ? `<small>visitada</small>` : `<button class="btn ghost" type="button" data-visit="${esc(l.id)}">Já fui</button>`) + `</div>`).join("")).join("")
    || `<p class="empty">Nenhuma loja desta galeria no filtro atual.</p>`;
}
$("sheet-list").addEventListener("click", e => { const b = e.target.closest("[data-visit]"); if (b) markVisited([b.dataset.visit], BY_ID.get(b.dataset.visit).Nome) });
$("sheet-all").addEventListener("click", () => { markVisited(GALERIAS.get(openGal).filter(inFilter).map(l => l.id), openGal); $("sheet").close() });
$("sheet-close").addEventListener("click", () => $("sheet").close());
$("sheet").addEventListener("close", () => openGal = null);

// ---------- lista ----------
const pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

function card(l) {
  const rows = [
    l.Endereço && ["Rua", esc(l.Endereço)],
    l.Horário && ["Horário", esc(l.Horário).replace(/; /g, "<br>")],
    l.Telefone && ["Telefone", `<a href="tel:${esc(l.Telefone.replace(/[^\d+]/g, ""))}">${esc(l.Telefone)}</a>`],
    l.WhatsApp && ["WhatsApp", `<a class="wa" href="https://wa.me/${esc(l.WhatsApp)}" target="_blank" rel="noopener">+${esc(l.WhatsApp)}</a>`],
  ].filter(Boolean);
  const dist = state.origem && posOf(l) ? `<span class="dist">${fmtDist(haversine(state.origem, posOf(l)))}</span>` : "";
  const where = l.Galeria
    ? `<div class="where"><button class="gal" type="button" data-gal="${esc(l.Galeria)}">${esc(l.Galeria)}</button>${l.Andar ? `<span class="floor">${esc(l.Andar)}</span>` : ""}${l.Box ? `<span class="floor">Box ${esc(l.Box)}</span>` : ""}${dist}</div>`
    : `<div class="where">Loja de rua${dist}</div>`;
  return `<article class="card">
    <div class="top"><h2 class="name">${esc(l.Nome)}</h2>${l.Nicho ? `<span class="nicho" title="${esc(l.Nicho)}">${esc(nichos(l)[0])}</span>` : ""}</div>
    ${where}
    ${rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : ""}
    ${l.Observação ? `<div class="note">${esc(l.Observação)}</div>` : ""}
    <div class="actions">
      <button class="btn ghost" type="button" data-copy="${esc(l.id)}">Copiar</button>
      <a class="btn main" href="${esc(mapsUrl(l))}" target="_blank" rel="noopener">${pin}Maps</a>
      <button class="btn soft" type="button" data-visit="${esc(l.id)}">Já fui</button>
    </div>
  </article>`;
}

function render() {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  let shown = LOJAS.filter(l => !visited.has(l.id) && inFilter(l) && words.every(w => l._q.includes(w)));
  if (state.origem) { // com origem: mais perto primeiro; sem coordenada vai para o fim
    const d = l => posOf(l) ? haversine(state.origem, posOf(l)) : Infinity;
    shown = shown.map(l => [d(l), l]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  }
  // shortcut: desenha só os 150 primeiros (celular trava com 1.300 cards); a busca acha o resto
  $("list").innerHTML = shown.length ? shown.slice(0, 150).map(card).join("")
    : `<p class="empty">Nenhuma loja encontrada. Tente parte do nome, sem acento.</p>`;
  $("count").textContent = `${shown.length} lojas` + (shown.length > 150 ? " (mostrando 150, busque para achar outras)" : "") + (visited.size ? ` · ${LOJAS.filter(l => visited.has(l.id)).length} visitadas escondidas` : "") + (state.origem ? " · mais perto primeiro" : "");
  renderRoute(); renderSheet();
  try { localStorage.setItem("filtros", JSON.stringify({ q: $("q").value, n: $("nicho").value, g: $("galeria").value })) } catch {}
}

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200) }

$("list").addEventListener("click", e => {
  const gal = e.target.closest("[data-gal]"); if (gal) return openGaleria(gal.dataset.gal);
  const v = e.target.closest("[data-visit]"); if (v) return markVisited([v.dataset.visit], BY_ID.get(v.dataset.visit).Nome);
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const text = fullAddress(BY_ID.get(b.dataset.copy));
  const fallback = () => { // clipboard recusado: tenta o método antigo; se falhar, mostra o texto
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.append(ta); ta.select();
    const ok = document.execCommand && document.execCommand("copy"); ta.remove();
    toast(ok ? "Endereço copiado" : text);
  };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(() => toast("Endereço copiado"), fallback) : fallback();
});

["q", "nicho", "galeria"].forEach(id => $(id).addEventListener("input", render));
try {
  const f = JSON.parse(localStorage.getItem("filtros") || "{}");
  $("q").value = f.q || ""; $("nicho").value = f.n || ""; $("galeria").value = f.g || "";
} catch {}
render();
</script>
</body></html>
